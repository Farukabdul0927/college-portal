<!DOCTYPE html>
<html>
<head>
    <title>College Portal Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 350px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .role-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #eee;
            font-size: 15px;
        }

        .role-buttons button.active {
            background: #667eea;
            color: white;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .login-button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #5568d9;
        }

        #roleText {
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>🎓 College Portal</h1>

    <p class="subtitle">
        Login as <span id="roleText">Student</span>
    </p>

    <div class="role-buttons">

        <button
            type="button"
            id="studentBtn"
            class="active"
            onclick="selectRole('student')">
            👨‍🎓 Student
        </button>

        <button
            type="button"
            id="teacherBtn"
            onclick="selectRole('teacher')">
            👨‍🏫 Teacher
        </button>

    </div>

    <form id="loginForm" action="/login" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button class="login-button" type="submit">
            Login
        </button>

    </form>

</div>


<script>

function selectRole(role) {

    const form = document.getElementById("loginForm");

    const studentBtn = document.getElementById("studentBtn");
    const teacherBtn = document.getElementById("teacherBtn");

    const roleText = document.getElementById("roleText");

    if (role === "student") {

        form.action = "/login";

        studentBtn.classList.add("active");
        teacherBtn.classList.remove("active");

        roleText.innerText = "Student";

    }

    else {

        form.action = "/teacher-login";

        teacherBtn.classList.add("active");
        studentBtn.classList.remove("active");

        roleText.innerText = "Teacher";

    }
}

</script>

</body>
</html>
