<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
</head>

<body>

    <h1>📊 Academic Results</h1>

    <h2>Welcome, {{ student.name }} 👋</h2>

    <p>
        <strong>Roll Number:</strong>
        {{ student.roll_number }}
    </p>

    <p>
        <strong>Class:</strong>
        {{ student.class_name }}
    </p>

    <hr>

    <h3>Subject Results</h3>

    <table border="1" cellpadding="10">

        <tr>
            <th>Subject</th>
            <th>Marks</th>
            <th>Grade</th>
        </tr>

        <tr>
            <td>Python</td>
            <td>90</td>
            <td>A+</td>
        </tr>

        <tr>
            <td>DBMS</td>
            <td>82</td>
            <td>A</td>
        </tr>

        <tr>
            <td>Computer Networks</td>
            <td>78</td>
            <td>B+</td>
        </tr>

    </table>

    <br>

    <a href="/dashboard">
        <button>⬅ Back to Dashboard</button>
    </a>

</body>
</html>
